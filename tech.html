            { title: "4. Artificial Intelligence", summary: "कृत्रिम बुद्धिमत्ता र मेसिन लर्निङ", link: "tech-topic4.html" },

        const container = document.getElementById('editable-card-container');

        cardData.forEach((item, index) => {
            const cardHTML = `
                <article class="card">
                    <div class="img-placeholder tech-placeholder">Tech ${index + 1}</div>
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <p class="justified">${item.summary}</p>
                        <a href="${item.link}" class="btn btn-card">To the topic</a>
                    </div>
                </article>
            `;
            container.innerHTML += cardHTML;
        });
