            { name: "2. Recycling and Material Recovery", url: "recycling-and-material-recovery.html" },
            { name: "3. Composting and Organic Waste Management", url: "composting-and-organic-waste-management.html" },

            { name: "6. Hazardous and Chemical Waste Management", url: "hazardous-and-chemical-waste-management.html" },

            { name: "20. Upcycling and Creative Reuse", url: "upcycling-and-creative-reuse.html" }
        ];

        const container = document.getElementById('topics-placeholder');

        subtopicsData.forEach(topic => {
            const link = document.createElement('a');
            link.href = topic.url;
            link.className = 'topic-line-link';
            link.innerHTML = `
                <span class="topic-title">${topic.name}</span>
                <span class="topic-icon">→</span>
            `;
            container.appendChild(link);
        });
