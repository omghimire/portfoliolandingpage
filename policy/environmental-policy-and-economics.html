            { name: "6. Cost-Benefit Analysis and Valuation of Nature", url: "cost-benefit-analysis-and-valuation-of-nature.html" },

            { name: "19. Environmental Policy and Economics in Nepal", url: "environmental-policy-and-economics-in-nepal.html" },
            { name: "20. Monitoring, Enforcement, and Policy Evaluation", url: "monitoring-enforcement-and-policy-evaluation.html" }
        ];

        const container = document.getElementById('topics-placeholder');

        subtopicsData.forEach(topic => {
            const link = document.createElement('a');
            link.href = topic.url;
            link.className = 'topic-line-link';
            link.innerHTML = `
                <span class="topic-title">${topic.name}</span>
                <span class="topic-icon">→</span>
            `;
            container.appendChild(link);
        });
    </script>
