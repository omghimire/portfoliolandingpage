    <header class="header">
        <nav class="navbar">
            <div class="logo">Om p. Ghimire</div>
            <ul class="nav-links" id="nav-links">

    <script src="../script.js"></script>

    <script>
        const subtopicsData = [
            { name: "1. Organic Farming and Natural Inputs", url: "organic-farming-and-natural-inputs.html" },
            { name: "2. Regenerative Agriculture and Soil Health", url: "regenerative-agriculture-and-soil-health.html" },
            { name: "3. Agroecology and Farm Biodiversity", url: "agroecology-and-farm-biodiversity.html" },
            { name: "4. Precision Agriculture and Smart Farming", url: "precision-agriculture-and-smart-farming.html" },
            { name: "5. Climate-Smart Agriculture", url: "climate-smart-agriculture.html" },
            { name: "6. Sustainable Irrigation and Agricultural Water Use", url: "sustainable-irrigation-and-agricultural-water-use.html" },
            { name: "7. Integrated Pest Management (IPM)", url: "integrated-pest-management.html" },
            { name: "8. Agroforestry and Silvopasture Systems", url: "agroforestry-and-silvopasture-systems.html" },
            { name: "9. Sustainable Livestock and Pasture Management", url: "sustainable-livestock-and-pasture-management.html" },
            { name: "10. Aquaculture and Sustainable Fisheries", url: "aquaculture-and-sustainable-fisheries.html" },

            { name: "13. Agri-Food Supply Chains and Food Miles", url: "agri-food-supply-chains-and-food-miles.html" },
            { name: "14. Plant-Based Diets and Alternative Proteins", url: "plant-based-diets-and-alternative-proteins.html" },
            { name: "15. Seed Sovereignty and Crop Diversity", url: "seed-sovereignty-and-crop-diversity.html" },

            { name: "17. Vertical Farming and Hydroponics", url: "vertical-farming-and-hydroponics.html" },
            { name: "18. Reducing Agrochemicals and Biofertilizers", url: "reducing-agrochemicals-and-biofertilizers.html" },
            { name: "19. Sustainable Agriculture in Nepal", url: "sustainable-agriculture-in-nepal.html" },
            { name: "20. Food Labels, Certification, and Policy", url: "food-labels-certification-and-policy.html" }
        ];

        const container = document.getElementById('topics-placeholder');

        subtopicsData.forEach(topic => {
            const link = document.createElement('a');
            link.href = topic.url;
            link.className = 'topic-line-link';
            link.innerHTML = `
                <span class="topic-title">${topic.name}</span>
                <span class="topic-icon">→</span>
            `;
            container.appendChild(link);
        });
    </script>
