    <script>
        /**
         * EDITABLE SECTION: 
         * Change the text within this array to update your 12 cards.
         */
        const cardData = [
            { title: "1. Artificial Intelligence & Machine Learning ", summary: "कृत्रिम बुद्धि र मेसिन लर्निङ", link: "#" },
            { title: "2. Web Development & Programming", summary: "वेब विकास र प्रोग्रामिङ", link: "#" },
            { title: "3. Cybersecurity & Data Privacy", summary: "साइबर सुरक्षा र डाटा गोपनीयता", link: "#" },
            { title: "4. Cloud Computing & Infrastructure", summary: "क्लाउड कम्प्युटिङ र पूर्वाधार", link: "#" },
            { title: "5. Mobile App Development", summary: "मोबाइल एप विकास", link: "#" },
            { title: "6. Data Science & Analytics", summary: "डाटा विज्ञान र विश्लेषण", link: "#" },
            { title: "7. Internet of Things (IoT)", summary: "इन्टरनेट अफ थिङ्स (IoT)", link: "#" },
            { title: "8. Blockchain & Cryptocurrency", summary: "ब्लकचेन र क्रिप्टोकरेन्सी", link: "#" },
            { title: "9. Software Engineering & DevOps", summary: "सफ्टवेयर इन्जिनियरिङ र DevOps", link: "#" },

        ];

        const container = document.getElementById('editable-card-container');
        
        cardData.forEach((item, index) => {
            const cardHTML = `
                <article class="card">
                    <div class="img-placeholder">Topic ${index + 1}</div>
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <p class="justified">${item.summary}</p>
                        <a href="${item.link}" class="btn btn-card">To the topic</a>
                    </div>
                </article>
            `;
            container.innerHTML += cardHTML;
        });
    </script>
