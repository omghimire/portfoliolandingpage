<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renewable &amp; Sustainable Energy | EcoVision</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">Om p. Ghimire</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../environment.html">Environment</a></li>
                <li><a href="../tech.html">Tech</a></li>
                <li><a href="../about.html">About Me</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="section-header">
            <h1>Renewable &amp; Sustainable Energy</h1>
            <figure class="topic-banner">
                <img src="images/renewable-energy-banner.jpg" alt="Solar panels, wind turbines, and a mountain hydropower valley in late-afternoon light">
            </figure>
            <p>Possible subtopics related to clean, affordable, and resilient energy systems.</p>
        </section>

        <section class="topics-list-container">
            <div class="topics-card">
                <nav class="vertical-links" id="topics-placeholder"></nav>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Omprakashghimire.com.np. All rights reserved.</p>
    </footer>

    <script src="../script.js"></script>

    <script>
        const subtopicsData = [
            { name: "1. Solar PV and Rooftop Solar Adoption", url: "solar-pv-and-rooftop-solar-adoption.html" },
            { name: "2. Wind Energy: Onshore and Offshore", url: "wind-energy-onshore-and-offshore.html" },
            { name: "3. Hydropower and Run-of-River Systems", url: "hydropower-and-run-of-river-systems.html" },
            { name: "4. Green Hydrogen and Clean Fuels", url: "green-hydrogen-and-clean-fuels.html" },
            { name: "5. Bioenergy and Sustainable Biomass", url: "bioenergy-and-sustainable-biomass.html" },
            { name: "6. Geothermal Energy Systems", url: "geothermal-energy-systems.html" },
            { name: "7. Microgrids and Decentralized Power", url: "microgrids-and-decentralized-power.html" },
            { name: "8. Smart Grids and Energy Storage", url: "smart-grids-and-energy-storage.html" },
            { name: "9. Energy-Efficient Buildings and Green Design", url: "energy-efficient-buildings-and-green-design.html" },
            { name: "10. Renewable Energy Policy and Finance", url: "renewable-energy-policy-and-finance.html" },
            { name: "11. Off-Grid Rural Electrification", url: "off-grid-rural-electrification.html" },
            { name: "12. Electric Mobility and Clean Transport", url: "electric-mobility-and-clean-transport.html" },
            { name: "13. Grid Integration of Variable Renewables", url: "grid-integration-of-variable-renewables.html" },
            { name: "14. Sustainable Cookstoves and Clean Cooking", url: "sustainable-cookstoves-and-clean-cooking.html" },
            { name: "15. Energy Access and Just Transition", url: "energy-access-and-just-transition.html" }
        ];

        const container = document.getElementById('topics-placeholder');

        subtopicsData.forEach(topic => {
            const link = document.createElement('a');
            link.href = topic.url;
            link.className = 'topic-line-link';
            link.innerHTML = `
                <span class="topic-title">${topic.name}</span>
                <span class="topic-icon">→</span>
            `;
            container.appendChild(link);
        });
    </script>
</body>
</html>
