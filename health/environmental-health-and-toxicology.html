    <header class="header">
        <nav class="navbar">
            <div class="logo">Om p. Ghimire</div>

    <script src="../script.js"></script>

    <script>
        const subtopicsData = [
            { name: "1. Principles of Environmental Toxicology", url: "principles-of-environmental-toxicology.html" },
            { name: "2. Dose-Response and Exposure Pathways", url: "dose-response-and-exposure-pathways.html" },
            { name: "3. Heavy Metals in Soil, Water, and Food", url: "heavy-metals-in-soil-water-and-food.html" },
            { name: "4. Pesticide Residues and Human Health", url: "pesticide-residues-and-human-health.html" },
            { name: "5. Persistent Organic Pollutants (POPs)", url: "persistent-organic-pollutants.html" },
            { name: "6. Endocrine Disruptors", url: "endocrine-disruptors.html" },
            { name: "7. Waterborne Diseases and Pathogens", url: "waterborne-diseases-and-pathogens.html" },
            { name: "8. Vector-Borne Diseases and Climate", url: "vector-borne-diseases-and-climate.html" },
            { name: "9. Occupational and Workplace Exposures", url: "occupational-and-workplace-exposures.html" },

            { name: "13. Antimicrobial Resistance in the Environment", url: "antimicrobial-resistance-in-the-environment.html" },
            { name: "14. Noise Pollution and Community Health", url: "noise-pollution-and-community-health.html" },

            { name: "18. Risk Assessment and Public Health Standards", url: "risk-assessment-and-public-health-standards.html" },
            { name: "19. Environmental Health in Nepal", url: "environmental-health-in-nepal.html" },
            { name: "20. Biomonitoring and Environmental Epidemiology", url: "biomonitoring-and-environmental-epidemiology.html" }
        ];

        const container = document.getElementById('topics-placeholder');

        subtopicsData.forEach(topic => {
            const link = document.createElement('a');
            link.href = topic.url;
            link.className = 'topic-line-link';
            link.innerHTML = `
                <span class="topic-title">${topic.name}</span>
                <span class="topic-icon">→</span>
            `;
            container.appendChild(link);
        });
    </script>
