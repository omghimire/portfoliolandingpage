    <script>
        const subtopicsData = [
            { name: "1. Watershed Management and River Basin Planning", url: "watershed-management-and-river-basin-planning.html" },
            { name: "2. Groundwater Resources and Aquifer Recharge", url: "groundwater-resources-and-aquifer-recharge.html" },

            const link = document.createElement('a');
            link.href = topic.url;
            link.className = 'topic-line-link';
            link.innerHTML = `
                <span class="topic-title">${topic.name}</span>

            container.appendChild(link);
